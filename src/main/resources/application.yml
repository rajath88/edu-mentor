server:
  # Prefer Render's PORT, then SERVER_PORT, then the local default.
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edumentor}
    username: ${DB_USER:edumentor}
    password: ${DB_PASSWORD:edumentor}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 10m

llm:
  api-key: ${LLM_API_KEY:}
  # Optional override; defaults to Google's OpenAI-compatible Gemini endpoint.
  base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
  model: ${LLM_MODEL:gemini-3.5-flash-lite}

mentor:
  rate-limit-per-minute: 10

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,https://*.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
