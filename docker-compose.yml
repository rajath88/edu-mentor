services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on: [app]

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/edumentor
      DB_USER: edumentor
      DB_PASSWORD: ${DB_PASSWORD:-edumentor}
      VALKEY_HOST: valkey
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edumentor
      POSTGRES_USER: edumentor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edumentor}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumentor"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  pgdata:
